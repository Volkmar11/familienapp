<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Zeitreise · 17. Juni 1956</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #2a1d10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    max-width: 100%; max-height: 100%; width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    touch-action: manipulation;
  }
  #bar {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%); display: flex; gap: 10px; z-index: 10;
  }
  button {
    border: 0; border-radius: 999px; padding: 12px 20px; font-size: 15px; font-weight: 600;
    color: #fff; background: rgba(120,72,32,0.55); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); cursor: pointer; transition: background .15s, transform .1s;
  }
  button:hover { background: rgba(150,92,42,0.7); }
  button:active { transform: scale(0.96); }
  button.primary { background: #c1462f; }
  button.primary:hover { background: #d75a3f; }
  button:disabled { opacity: .5; cursor: default; }
  #hint {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); color: rgba(255,255,255,.55); font-size: 12px; z-index: 10;
    text-align: center; width: 90%;
  }
</style>
</head>
<body>
  <div id="hint"></div>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="replay">↺ Nochmal</button>
    <button id="save" class="primary">🎬 Als Video speichern</button>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const START_YEAR = 2026;
const END_YEAR   = 1956;
const MONTH = 5;   // Juni (0-basiert)
const DAY   = 17;

// --- Zeitleiste der Animation (Sekunden) ---
const T_INTRO  = 1.8;
const T_SCROLL = 8.0;
const T_HOLD   = 4.4;
const T_END    = T_INTRO + T_SCROLL + T_HOLD;

const WD = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONTHS = ["JANUAR","FEBRUAR","MÄRZ","APRIL","MAI","JUNI","JULI","AUGUST","SEPTEMBER","OKTOBER","NOVEMBER","DEZEMBER"];
function weekday(year){ return WD[new Date(year, MONTH, DAY).getDay()]; }

function easeInOutCubic(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOutBack(t){ const c=1.70158, p=c+1; return 1+p*Math.pow(t-1,3)+c*Math.pow(t-1,2); }
function lerp(a,b,t){ return a+(b-a)*t; }

// --- 70er-Palette ---
const C_BROWN  = '#5b3a1e';   // Texte
const C_BROWN2 = '#8a6240';   // gedämpft
const C_ORANGE = '#c1462f';   // Akzent / Header
const C_DARK   = '#3b2415';   // große Zahl

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// --- Hintergrundbild (70er Flower-Power-Rahmen) ---
let bgReady = false;
const bg = new Image();
bg.onload = () => { bgReady = true; window.bgReady = true; play(); };
bg.src = 'zeitreise-bg.png';

// dezente, warm driftende Staubpartikel im cremefarbenen Innenbereich
const motes = Array.from({length:34}, () => ({
  x: 0.20 + Math.random()*0.60,   // relativ
  y: Math.random(),
  r: Math.random()*2.4+0.6, s: Math.random()*0.4+0.15
}));

function drawBackground(p, time){
  if (bgReady) {
    ctx.drawImage(bg, 0, 0, W, H);
  } else {
    ctx.fillStyle = '#f3e7c6'; ctx.fillRect(0,0,W,H);
  }

  // warme Staubpartikel im Innenbereich
  ctx.save();
  for(const m of motes){
    const y = (m.y + time*0.03*m.s) % 1;
    const px = m.x*W, py = lerp(0.16,0.86,y)*H;
    ctx.globalAlpha = 0.18*m.s + 0.05;
    ctx.fillStyle = '#b5793f';
    ctx.beginPath(); ctx.arc(px, py, m.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Vintage-Vignette + leichte Alterung, verstärkt sich beim Zurückreisen
  const vig = ctx.createRadialGradient(W/2,H/2,H*0.30, W/2,H/2,W*0.62);
  vig.addColorStop(0, 'rgba(60,30,10,0)');
  vig.addColorStop(1, `rgba(50,25,8,${0.16 + 0.20*p})`);
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

  // Sepia-Hauch (deepens going back)
  ctx.fillStyle = `rgba(120,70,25,${0.06*p})`;
  ctx.fillRect(0,0,W,H);
}

// feines Filmkorn für den Retro-Look
function drawGrain(amount){
  if(amount<=0) return;
  ctx.save();
  ctx.globalAlpha = amount;
  for(let i=0;i<900;i++){
    const x = Math.random()*W, y = Math.random()*H;
    ctx.fillStyle = Math.random()>0.5 ? '#000' : '#fff';
    ctx.fillRect(x,y,1.4,1.4);
  }
  ctx.restore();
}

// Zeitleisten-Lineal: Jahre gleiten vorbei (im cremefarbenen Innenbereich)
function drawTimeline(yearFloat, alpha){
  const cx = W/2, y = H*0.785, spacing = 215;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';

  ctx.strokeStyle = 'rgba(120,80,40,0.30)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(W*0.20,y); ctx.lineTo(W*0.80,y); ctx.stroke();

  const base = Math.round(yearFloat);
  for(let d=-4; d<=4; d++){
    const yr = base + d;
    if(yr < END_YEAR-2 || yr > START_YEAR+2) continue;
    const x = cx + (yr - yearFloat)*spacing;
    if(x < W*0.16 || x > W*0.84) continue;
    const dist = Math.abs(x-cx)/(spacing*2.4);
    const fade = Math.max(0, 1-dist);
    const isCenter = Math.abs(yr - yearFloat) < 0.5;

    ctx.strokeStyle = `rgba(91,58,30,${0.45*fade})`;
    ctx.lineWidth = yr%10===0 ? 4 : 2;
    const tickH = yr%10===0 ? 26 : 15;
    ctx.beginPath(); ctx.moveTo(x, y-tickH); ctx.lineTo(x, y+tickH); ctx.stroke();

    const size = isCenter ? 50 : 32;
    ctx.font = `${isCenter?800:600} ${size}px -apple-system, "Segoe UI", sans-serif`;
    ctx.fillStyle = isCenter ? `rgba(193,70,47,${fade})` : `rgba(91,58,30,${0.6*fade})`;
    ctx.fillText(String(yr), x, y + 66);
  }

  // Gegenwartszeiger
  ctx.fillStyle = C_ORANGE;
  ctx.beginPath();
  ctx.moveTo(cx, y-34); ctx.lineTo(cx-14, y-56); ctx.lineTo(cx+14, y-56);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Kalender-Karte (mittig im Innenbereich)
function drawCalendar(year, scale, glow){
  const cw = 380, ch = 460;
  const x = (W-cw)/2, y = H*0.215;

  ctx.save();
  ctx.translate(x+cw/2, y+ch/2);
  ctx.scale(scale, scale);
  ctx.translate(-(x+cw/2), -(y+ch/2));

  ctx.shadowColor = `rgba(193,70,47,${0.25 + glow*0.6})`;
  ctx.shadowBlur = 30 + 50*glow;
  ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#fffdf6';
  roundRect(x, y, cw, ch, 26); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // Header (Monat)
  ctx.fillStyle = C_ORANGE;
  roundRect(x, y, cw, 96, 26); ctx.fill();
  ctx.fillRect(x, y+58, cw, 38);
  ctx.fillStyle = '#fff7ec';
  ctx.textAlign = 'center';
  ctx.font = '800 50px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(MONTHS[MONTH], x+cw/2, y+68);

  // Tag
  ctx.fillStyle = C_DARK;
  ctx.font = '800 195px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(String(DAY), x+cw/2, y+265);

  // Wochentag
  ctx.fillStyle = C_BROWN2;
  ctx.font = '600 34px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(weekday(year), x+cw/2, y+320);

  // Jahr
  ctx.fillStyle = C_ORANGE;
  ctx.font = '800 72px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(String(year), x+cw/2, y+410);

  ctx.restore();
}

function drawTitle(title, sub, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(255,250,235,0.7)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = C_BROWN;
  ctx.font = '800 52px -apple-system, "Segoe UI", sans-serif';
  ctx.fillText(title, W/2, H*0.135);
  if(sub){
    ctx.font = '600 32px -apple-system, "Segoe UI", sans-serif';
    ctx.fillStyle = C_ORANGE;
    ctx.fillText(sub, W/2, H*0.135 + 46);
  }
  ctx.restore();
}

function flowers(time, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  const cols = ['#c1462f','#e0a43b','#3e8b7d','#d76a8a'];
  const N = 12;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2 + time*0.5;
    const rad = 300 + Math.sin(time*2+i)*30;
    const x = W/2 + Math.cos(a)*rad*1.4;
    const y = H*0.42 + Math.sin(a)*rad*0.8;
    const s = 26 + Math.sin(time*3+i)*8;
    ctx.fillStyle = cols[i%cols.length];
    ctx.font = `${s}px serif`;
    ctx.fillText('✿', x, y);
  }
  ctx.restore();
}

function render(t){
  let year, p, scale=1, glow=0, tlAlpha=0, titleAlpha=1, title, sub='';

  if(t < T_INTRO){
    const k = t/T_INTRO;
    year = START_YEAR; p = 0;
    scale = lerp(0.72, 1, easeOutBack(Math.min(1,k*1.1)));
    titleAlpha = Math.min(1, k*1.5);
    tlAlpha = Math.min(1, k);
    title = 'Eine kleine Zeitreise';
    sub = 'Heute · ' + START_YEAR;
    drawBackground(p, t);
    drawTimeline(year, tlAlpha);
    drawCalendar(year, scale, 0);
    drawTitle(title, sub, titleAlpha);
    drawGrain(0.02);
    return;
  }
  if(t < T_INTRO + T_SCROLL){
    const k = (t - T_INTRO)/T_SCROLL;
    const e = easeInOutCubic(k);
    const yf = lerp(START_YEAR, END_YEAR, e);
    year = Math.round(yf); p = e;
    drawBackground(p, t);
    drawTimeline(yf, 1);
    drawCalendar(year, 1, 0);
    drawTitle('… zurück durch die Jahre …', '', 1);
    drawGrain(0.02 + 0.03*p);
    return;
  }
  // Ankunft
  const k = Math.min(1,(t - T_INTRO - T_SCROLL)/T_HOLD);
  year = END_YEAR; p = 1;
  glow = Math.sin(Math.min(1,k*2)*Math.PI/2);
  scale = lerp(1, 1.05, easeOutBack(Math.min(1,k*1.6)));
  tlAlpha = Math.max(0, 1-k*1.5);
  drawBackground(p, t);
  if(tlAlpha>0) drawTimeline(END_YEAR, tlAlpha);
  flowers(t, glow);
  drawCalendar(year, scale, glow);
  drawTitle('Angekommen', weekday(END_YEAR) + ', 17. Juni ' + END_YEAR, 1);
  drawGrain(0.04);
}

// --- Abspiel-Schleife ---
let startTs = null, raf = null;
function loop(ts){
  if(startTs===null) startTs = ts;
  const t = (ts - startTs)/1000;
  render(Math.min(t, T_END));
  if(t < T_END){ raf = requestAnimationFrame(loop); }
}
function play(){
  cancelAnimationFrame(raf);
  startTs = null;
  raf = requestAnimationFrame(loop);
}
document.getElementById('replay').addEventListener('click', play);

// --- Als Video (.webm) exportieren ---
const saveBtn = document.getElementById('save');
const hint = document.getElementById('hint');
saveBtn.addEventListener('click', async () => {
  if(!canvas.captureStream || !window.MediaRecorder){
    hint.textContent = 'Video-Export wird von diesem Browser nicht unterstützt — nimm den Bildschirm auf.';
    return;
  }
  const types = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || 'video/webm';
  const stream = canvas.captureStream(60);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  const chunks = [];
  rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'zeitreise-17-juni-1956.' + (mime.includes('mp4')?'mp4':'webm');
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    saveBtn.disabled = false; saveBtn.textContent = '🎬 Als Video speichern';
    hint.textContent = 'Fertig! Video wurde heruntergeladen.';
  };
  saveBtn.disabled = true; saveBtn.textContent = '● Nehme auf …';
  hint.textContent = 'Bitte warten, die Aufnahme läuft …';
  rec.start(); play();
  setTimeout(() => rec.stop(), (T_END + 0.3) * 1000);
});

// Fallback-Start, falls Bild im Cache/blockiert
setTimeout(() => { if(!bgReady) play(); }, 600);
hint.textContent = 'Tippe „Nochmal" zum erneuten Abspielen · „Als Video speichern" für eine Videodatei';
</script>
</body>
</html>
